# =============================================================================
# TEST CONFIGURATION
# =============================================================================
spring.application.name=financial-transaction-processor-test

# H2 in-memory database for tests — no MODE=PostgreSQL to avoid
# dialect incompatibilities with Hibernate-generated lock syntax.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate — auto-detect H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# SQL initialization — load seed data for integration tests
spring.sql.init.mode=always

# Logging — quieter in tests
logging.level.com.assignment.transaction=INFO
logging.level.org.hibernate.SQL=WARN
