# =============================================================================
# APPLICATION
# =============================================================================
spring.application.name=financial-transaction-processor

# =============================================================================
# DATASOURCE — H2 In-Memory Database
# =============================================================================
# DB_CLOSE_DELAY=-1: Keeps the database alive for the lifetime of the JVM,
# preventing premature shutdown between test phases.
spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
# create-drop: Hibernate creates the schema on startup and drops it on shutdown.
# Ideal for interview demos — ensures a clean state on every restart.
spring.jpa.hibernate.ddl-auto=create-drop

# show-sql: Logs every SQL statement for debugging. In production, this would
# be false, but for an interview demo it helps demonstrate correctness.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect: Let Hibernate auto-detect H2Dialect from the JDBC URL.
# DO NOT set PostgreSQLDialect — H2 does not support PostgreSQL-specific
# lock syntax (FOR NO KEY UPDATE) or session variables (client_min_messages).

# defer-datasource-initialization: Critical — ensures Hibernate creates all
# tables BEFORE Spring executes data.sql. Without this, data.sql would run
# against a schema that doesn't exist yet and fail.
spring.jpa.defer-datasource-initialization=true

# =============================================================================
# H2 CONSOLE
# =============================================================================
# Enables the browser-based H2 console at http://localhost:8080/h2-console
# for interactive SQL queries during development.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================================================
# SQL INITIALIZATION
# =============================================================================
# ALWAYS: Forces data.sql to execute on every startup, ensuring seed data is
# always present regardless of the DDL strategy.
spring.sql.init.mode=always

# =============================================================================
# SERVER
# =============================================================================
server.port=8080

# =============================================================================
# LOGGING
# =============================================================================
# DEBUG for our application code to see batch processing details.
# WARN for Hibernate SQL to reduce noise (show-sql handles query logging).
logging.level.com.assignment.transaction=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
